<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3e63dd">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Juegos de Psicopedagogía</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧠%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4fb; --panel:#ffffff; --ink:#1a2140; --muted:#59627f; --line:#dde2f2; --soft:#eaedfb;
  --brand:#4f46d8; --brand-ink:#ffffff; --sun:#ffc233; --sun-ink:#3a2a00;
  --good:#12935f; --bad:#d93a50; --warn:#b97a00;
  --r:16px; --r-lg:24px; --fs:1;
  --shadow:0 1px 2px rgba(26,33,64,.06),0 10px 24px -10px rgba(26,33,64,.18);
  --font-d:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#10132a;--panel:#1a1f3f;--ink:#eef0ff;--muted:#a4abcf;--line:#2b3260;--soft:#232a55;--brand:#9a93ff;--brand-ink:#0d1033;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -10px rgba(0,0,0,.6);--sun-ink:#3a2a00;--good:#3ed598;--bad:#ff7088;--warn:#ffc233;color-scheme:dark}
  html[data-contrast=on]:not([data-theme=light]){--bg:#000;--panel:#000;--ink:#fff;--muted:#ddd;--line:#fff;--brand:#8fb0ff;--good:#5fe3a1;--bad:#ff7b7b}
}
:root[data-theme=dark]{--bg:#10132a;--panel:#1a1f3f;--ink:#eef0ff;--muted:#a4abcf;--line:#2b3260;--soft:#232a55;--brand:#9a93ff;--brand-ink:#0d1033;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -10px rgba(0,0,0,.6);--sun-ink:#3a2a00;--good:#3ed598;--bad:#ff7088;--warn:#ffc233;color-scheme:dark}
html[data-contrast=on]{--bg:#fff;--panel:#fff;--ink:#000;--muted:#222;--line:#000;--brand:#0027b3;--good:#006b3c;--bad:#b00020}
html[data-theme=dark][data-contrast=on]{--bg:#000;--panel:#000;--ink:#fff;--muted:#ddd;--line:#fff;--brand:#8fb0ff;--good:#5fe3a1;--bad:#ff7b7b}
html[data-easy=on]{--bg:#fbf6e6}
html[data-easy=on] body{font-family:Verdana,"Trebuchet MS",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.14em;line-height:1.8}
html[data-easy=on] h1,html[data-easy=on] h2,html[data-easy=on] h3{font-family:Verdana,"Trebuchet MS",sans-serif}
html[data-motion=reduced] *{transition:none!important;animation:none!important}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.55 var(--font-b);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 8%,transparent) 1px,transparent 1.6px);background-size:24px 24px}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:1.45rem;margin:0}
h2{font-size:1.3rem;margin:.1rem 0}
h3{font-size:1.05rem;margin:.9rem 0 .3rem}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.lead{font-size:1.2rem;font-weight:700;line-height:1.4;margin:.5rem 0}

/* cabecera */
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;filter:drop-shadow(0 3px 0 color-mix(in srgb,var(--brand) 55%,#000))}
.brand small{display:block;color:var(--muted);font-size:.82rem;line-height:1.1}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:1px;border-color:var(--brand)}
textarea{width:100%}

/* botones con relieve */
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 20px;background:var(--brand);color:var(--brand-ink);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 60%,#000);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:9px 18px;box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.sm{padding:7px 13px;font-size:.92rem;border-radius:12px;box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn.ghost.sm{padding:5px 12px;box-shadow:0 2px 0 var(--line)}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #c98d00}
a.btn{text-decoration:none;display:inline-block}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* navegación */
.nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;margin:6px 0 16px;padding:4px;background:var(--panel);border:2px solid var(--line);border-radius:16px;width:fit-content;max-width:100%}
.nav .btn{white-space:nowrap;background:transparent;color:var(--ink);box-shadow:none;border:0;padding:8px 14px;font-size:.95rem;border-radius:12px}
.nav .btn:active{transform:none}
.nav .btn.act{background:var(--brand);color:var(--brand-ink)}

/* menú */
.hello{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.hi{font-size:1.9rem;margin:0}
.reco{display:flex;gap:14px 18px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--brand);color:var(--brand-ink);border-radius:var(--r-lg);padding:16px 20px;box-shadow:0 5px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.reco .kick{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
.reco .rt{font-family:var(--font-d);font-size:1.35rem;font-weight:600;line-height:1.2}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:baseline;padding:4px 12px;border-radius:99px;background:var(--panel);border:2px solid var(--line);font-size:.92rem}
.pill b{font-family:var(--font-d);font-size:1.05rem}
.find{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.find input{flex:1;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{font:inherit;font-size:.88rem;font-weight:700;padding:4px 12px;border-radius:99px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--brand));margin-right:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sect{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px}
.sect h2{font-size:1.15rem;display:flex;align-items:center;gap:9px}
.sect h2::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.sect span{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{--c:var(--brand);position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
.card:active{transform:translateY(0);box-shadow:0 0 0 var(--line)}
.tile{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:color-mix(in srgb,var(--c) 18%,var(--panel));border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.ct{min-width:0}
.card h3{margin:0;font-size:1rem}
.card p{margin:.15rem 0 0;font-size:.86rem;line-height:1.35}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.02em;margin-top:2px;color:color-mix(in srgb,var(--c,var(--brand)) 70%,var(--ink))}
.badge{position:absolute;top:8px;right:10px;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--bc) 16%,var(--panel));color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 40%,transparent)}

/* paneles y juego */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel.game{border-color:color-mix(in srgb,var(--c,var(--brand)) 45%,var(--line));padding-top:14px}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.gh{display:flex;align-items:center;gap:10px;min-width:0}
.gh .tile{width:42px;height:42px;font-size:1.3rem;border-radius:12px}
.prog{height:12px;background:var(--soft);border-radius:9px;overflow:hidden;flex:1;min-width:120px;border:2px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--sun);width:0;transition:width .25s;border-radius:9px}
.stage{text-align:center}
.status{min-height:2em;font-size:1.15rem;font-weight:700;margin:6px 0;font-family:var(--font-d);font-weight:500}
.big{font-size:4.5rem;line-height:1.1;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.opt,.tok{font:inherit;font-size:1.3rem;font-weight:700;min-width:64px;min-height:62px;max-width:100%;padding:8px 18px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--panel);color:var(--ink);cursor:pointer;transition:transform .08s}
.opt:hover:not(:disabled),.tok:hover:not(:disabled){border-color:var(--brand)}
.opt:active:not(:disabled),.tok:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt.right{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.emo{font-size:2.4rem}
.row.nowrap{flex-wrap:nowrap;gap:5px}
.opt.emo.sm{font-size:1.7rem;min-width:0;min-height:52px;padding:6px 2px;flex:1 1 0}
.tok{background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
.tok.emo{font-size:2rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;padding:10px;border:3px dashed var(--line);border-radius:var(--r);margin:10px 0;background:var(--soft)}
.slot{width:54px;height:54px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:380px;margin:12px auto}
.pad{min-height:105px;border-radius:22px;border:0;font:inherit;font-weight:800;color:#111;background:var(--c);opacity:.6;cursor:pointer;font-size:1.1rem;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000)}
.pad.on{opacity:1;transform:scale(1.04);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 40%,transparent)}
.pad:disabled{cursor:default}
.blk{aspect-ratio:1;border-radius:14px;border:0;background:var(--soft);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer}
.blk.on{background:var(--sun);box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 45%,transparent)}
.blk:disabled{cursor:default}
.lives{letter-spacing:4px}
.go-btn{width:min(100%,420px);min-height:96px;font-size:1.6rem}
.stim{height:130px;display:flex;align-items:center;justify-content:center;font-size:5.5rem}
.mem{display:grid;gap:10px;margin:12px auto;max-width:520px}
.mc{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--brand);color:#fff;font-size:2.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.mc.up{background:var(--panel);color:var(--ink)}
.mc.done{background:color-mix(in srgb,var(--good) 25%,var(--panel));border-color:var(--good)}
.shape{font-size:3.2rem;line-height:1}
.ref{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;padding:10px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.ref:hover{border-color:var(--brand)}
.stimcard{display:inline-flex;flex-direction:column;align-items:center;padding:12px 24px;border-radius:18px;border:3px dashed var(--muted);margin:8px 0;background:var(--panel)}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:2.1rem;font-weight:800;margin:12px 0;font-family:var(--font-d)}
.seq span{min-width:50px;padding:6px 8px;border-radius:12px;background:var(--soft)}
.seq .q{background:var(--sun);color:var(--sun-ink)}
.letter{font-family:Arial,Helvetica,sans-serif;font-size:5rem;font-weight:700;letter-spacing:.12em}
.optletter{font-family:Arial,Helvetica,sans-serif;font-size:2.2rem;display:inline-block}
.rot{display:inline-block}
.cgrid{display:grid;gap:6px;margin:10px auto;max-width:480px}
.cell{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:1.5rem;font-weight:700;cursor:pointer;padding:0}
.cell.lit{background:var(--brand);border-color:var(--brand)}
.cell.right{background:var(--good);color:#fff;border-color:var(--good)}
.cell.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.cell.miss{border:3px dashed var(--good)}
.dots{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:2.4rem;max-width:460px;margin:8px auto;padding:10px;background:var(--soft);border-radius:var(--r)}
.dots span{display:inline-block}
.situ p.lead{max-width:34ch;margin-inline:auto}
.passage{text-align:left;font-size:1.15rem;background:var(--soft);padding:14px 16px;border-radius:var(--r);margin:8px 0;max-width:60ch;margin-inline:auto}
.stroop{font-family:var(--font-d);font-weight:700;font-size:3.4rem;letter-spacing:.05em}
.swatch{width:120px;height:120px;border-radius:24px;margin:10px auto;border:3px solid var(--ink)}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:8px;vertical-align:-2px;border:2px solid var(--ink)}
.money{display:inline-grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:1.2rem;border:3px solid var(--ink);background:color-mix(in srgb,var(--sun) 55%,var(--panel));color:var(--ink)}
.money.coin{width:62px;height:62px;border-radius:50%}
.money.bill{width:96px;height:52px;border-radius:8px;background:color-mix(in srgb,var(--good) 30%,var(--panel))}
.react{width:min(100%,300px);height:200px;border-radius:50%;border:0;font:inherit;font-family:var(--font-d);font-size:1.7rem;font-weight:600;background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 4px var(--line);cursor:pointer}
.react.go{background:var(--good);color:#fff}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:10px auto}
.key{font:inherit;font-family:var(--font-d);font-size:1.6rem;font-weight:600;min-height:56px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--panel);color:var(--ink);cursor:pointer}
.key:active{transform:translateY(3px);border-bottom-width:2px}
.digits{font-family:var(--font-d);font-size:3.6rem;font-weight:600;min-height:5rem;letter-spacing:.1em}
.hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:10px auto}
.peg{position:relative;height:230px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;padding:0 4px 8px;border:2px solid var(--line);border-radius:var(--r);background:var(--soft);cursor:pointer;font:inherit}
.peg.sel{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 40%,transparent)}
.rod{position:absolute;bottom:0;left:50%;width:8px;height:88%;margin-left:-4px;background:var(--line);border-radius:6px}
.disc{position:relative;height:26px;border-radius:10px;max-width:100%;border:2px solid rgba(0,0,0,.25)}
.mat{display:inline-grid;gap:6px;margin:10px auto}
.mat>div{width:78px;height:78px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--panel)}
.mat .q{background:var(--sun);color:var(--sun-ink);font-family:var(--font-d);font-size:2rem;font-weight:700}
.clock{display:flex;justify-content:center}

/* resultados */
.fb{min-height:1.8em;font-weight:700;font-size:1.08rem}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.ring{--p:0;--c:var(--brand);width:132px;height:132px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--line) 0)}
.ring>div{width:82%;height:82%;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--font-d);font-size:1.9rem;font-weight:600;line-height:1}
.ring small{display:block;font-size:.7rem;color:var(--muted);font-family:var(--font-b)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0;text-align:center}
.stat{background:var(--soft);border-radius:14px;padding:9px;font-size:.88rem;color:var(--muted)}
.stat b{display:block;font-size:1.45rem;color:var(--ink);font-family:var(--font-d);font-weight:600}
.sem{display:inline-block;padding:3px 14px;border-radius:99px;font-weight:700;border:2px solid var(--line)}
ul.notes{text-align:left;padding-left:20px}
ul.notes li{margin:.3rem 0}
fieldset{border:2px solid var(--line);border-radius:14px;margin:12px auto;max-width:460px;text-align:left}
.lv{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.lv label{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;background:var(--panel);font-weight:700}
.lv input{position:absolute;opacity:0;inset:0;cursor:pointer}
.lv label:has(input:checked){background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.lv label:has(input:focus-visible){outline:3px solid var(--sun);outline-offset:2px}
.lab{font-weight:700;margin:10px 0 2px;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.ach{display:inline-block;margin:3px;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--good) 16%,var(--panel));border:2px solid var(--good);font-size:.86rem;font-weight:700}
.ach.off{background:transparent;border-color:var(--line);color:var(--muted);opacity:.75}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;background:var(--c)}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.ov[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:var(--r-lg);padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.mbox label{display:block;margin:8px 0 2px;font-weight:700}
.mbox input{width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:700;max-width:92vw}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall 2.6s ease-in forwards}

<body>
<div class="wrap">
  <header class="top noprint">
    <div class="brand"><svg width="42" height="42" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--brand)"/><circle cx="14" cy="14" r="5.5" fill="#ffc233"/><rect x="21" y="8" width="11" height="11" rx="3" fill="#fff"/><path d="M8 29h24" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg><div><h1>Juegos de psicopedagogía</h1><small>Observación lúdica de habilidades</small></div></div>
    <div class="tools">
      <select id="prof" aria-label="Alumno o alumna"></select>

</div>
<div class="ov" id="pause" hidden><div class="mbox" style="text-align:center"><h2>⏸ En pausa</h2><p class="muted">Tomate un respiro. La partida sigue donde la dejaste.</p><button class="btn" id="resume">▶ Continuar</button></div></div>

<script>
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const rs_ = ms => new Promise(r => setTimeout(r, ms));
let paused = false;
async function sleep(ms) { await rs_(ms); while (paused) await rs_(100); }
const rnd = n => Math.floor(Math.random() * n);
const R = (a, b) => a + rnd(b - a + 1);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayKey = ts => new Date(ts).toLocaleDateString('sv');
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(k)); }
  return el;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function download(name, mime, text) {
  const ta = h('textarea', { rows: 8, readonly: true }, text); let close;
  const a = h('a', { class: 'btn sm', href: URL.createObjectURL(new Blob(['\ufeff' + text], { type: mime + ';charset=utf-8' })), download: name }, '⬇ Descargar archivo');
  const copy = () => { ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast('Copiado'), () => { try { document.execCommand('copy'); toast('Copiado'); } catch (e) {} }); };
  close = modal(h('div', {}, h('h2', {}, 'Exportar: ' + name), h('p', { class: 'muted' }, 'Copiá el texto y pegalo en un archivo, o descargalo si tu navegador lo permite.'), ta,
    h('div', { class: 'row' }, h('button', { class: 'btn sm', onclick: copy }, '📋 Copiar'), a, h('button', { class: 'btn ghost sm', onclick: () => close() }, 'Cerrar'))));
}
function toast(msg) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 3800); }
function confetti() {
  if (S.reduce) return;
  const cols = ['#e5484d', '#3e63dd', '#30a46c', '#f5c518', '#9d4edd'];
  for (let i = 0; i < 46; i++) {
    const c = h('div', { class: 'conf', style: 'left:' + rnd(100) + 'vw;background:' + pick(cols) + ';animation-delay:' + (rnd(600) / 1000) + 's' });
    document.body.append(c); setTimeout(() => c.remove(), 3400);
  }
}
function askConfirm(msg, onYes, onNo, yes = 'Sí', no = 'Cancelar') {
  let close;
  close = modal(h('div', {}, h('p', {}, msg), h('div', { class: 'row' },
    h('button', { class: 'btn', onclick: () => { close(); onYes && onYes(); } }, yes),
    h('button', { class: 'btn ghost', onclick: () => { close(); onNo && onNo(); } }, no))));
}
function modal(node) {
  const ov = h('div', { class: 'ov', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'mbox' }, node));
  document.body.append(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  return close;
}

/* ================= ajustes ================= */
const DEF = { theme: 'auto', fs: 1, easy: false, contrast: false, reduce: false, volume: .6, voice: false, np: false };
let S = { ...DEF, ...store.get('pp2_settings', {}) };
const INIT_THEME = document.documentElement.getAttribute('data-theme');
function applySettings() {
  const r = document.documentElement;
  if (S.theme === 'auto') { if (INIT_THEME) r.setAttribute('data-theme', INIT_THEME); else r.removeAttribute('data-theme'); } else r.dataset.theme = S.theme;
  r.style.setProperty('--fs', S.fs);
  r.dataset.easy = S.easy ? 'on' : 'off'; r.dataset.contrast = S.contrast ? 'on' : 'off'; r.dataset.motion = S.reduce ? 'reduced' : 'normal';
  document.body.classList.toggle('np', S.np);
  store.set('pp2_settings', S);
}
applySettings();

/* ================= sonido y voz ================= */
let audioCtx = null;
function beep(freq = 440, dur = .15, type = 'sine', vol = .08) {
  if (!S.volume) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime, v = vol * S.volume / .6;
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sOk = () => { beep(660, .12); setTimeout(() => beep(880, .15), 110); };
const sBad = () => beep(190, .25, 'sawtooth', .05);
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-AR'; u.rate = .8; u.volume = Math.max(.1, S.volume); speechSynthesis.speak(u); } catch (e) {} }
const say = t => { if (S.voice) speak(t); };
const PRAISE = ['¡Muy bien!', '¡Excelente!', '¡Eso es!', '¡Genial!', '¡Bien pensado!', '¡Lo lograste!'];
const RETRY = ['Casi. ¡Seguí intentando!', 'Los errores ayudan a aprender', 'Probemos con la que sigue', 'No pasa nada, ¡vamos!'];

/* ================= datos: perfiles, resultados, logros ================= */
let profiles = store.get('pp2_profiles', []);
let curId = store.get('pp2_cur', null);
let results = store.get('pp2_results', []);
let achs = store.get('pp2_ach', {});
const saveP = () => { store.set('pp2_profiles', profiles); store.set('pp2_cur', curId); };
const saveR = () => store.set('pp2_results', results);
const saveA = () => store.set('pp2_ach', achs);
const cur = () => profiles.find(p => p.id === curId) || profiles[0];
if (!profiles.length) { profiles = [{ id: 'p' + uid(), name: 'Alumno/a 1', age: 8 }]; curId = profiles[0].id; saveP(); }
if (!profiles.find(p => p.id === curId)) { curId = profiles[0].id; saveP(); }
const levelByAge = age => age <= 6 ? 1 : age <= 9 ? 2 : 3;
const LV = ['', 'Fácil', 'Medio', 'Difícil'];
const resOf = pid => results.filter(r => r.pid === pid);
function streak(pid) {
  const days = new Set(resOf(pid).map(r => dayKey(r.ts)));
  let d = new Date(), n = 0;
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const ACH = [
  { id: 'first', t: '🌱 Primera partida', f: rs => rs.length >= 1 },
  { id: 'ten', t: '🔟 10 partidas jugadas', f: rs => rs.length >= 10 },
  { id: 'five', t: '🧭 Explorador (5 juegos distintos)', f: rs => new Set(rs.map(r => r.gid)).size >= 5 },
  { id: 'all', t: '🏅 Todoterreno (todos los juegos)', f: rs => new Set(rs.map(r => r.gid)).size >= GAMES.length },
  { id: 'perfect', t: '💯 Puntaje perfecto', f: rs => rs.some(r => r.pct >= 100) },
  { id: 'perf3', t: '🌟 3 partidas de 85% o más', f: rs => rs.filter(r => r.pct >= 85).length >= 3 },
  { id: 'streak3', t: '🔥 Racha de 3 días', f: (rs, pid) => streak(pid) >= 3 },
  { id: 'hard', t: '🦾 Terminó un juego en Difícil', f: rs => rs.some(r => r.level === 3) },
  { id: 'circuit', t: '🎲 Circuito completo', f: () => false }
];
function unlock(pid, id) {
  achs[pid] = achs[pid] || {};
  if (achs[pid][id]) return null;
  achs[pid][id] = Date.now(); saveA();
  return ACH.find(a => a.id === id);
}
function checkAch(pid) {
  const rs = resOf(pid), out = [];
  ACH.forEach(a => { if (a.f(rs, pid)) { const u = unlock(pid, a.id); if (u) out.push(u); } });
  return out;
}

/* ================= navegación ================= */
const app = $('#app');
let session = 0, playing = false, rerender = () => showHub(), curNav = 'hub';
const NAVS = [['hub', 'Juegos'], ['circuit', 'Circuito'], ['progress', 'Progreso'], ['settings', 'Ajustes'], ['help', 'Ayuda']];
function setNav(v) { curNav = v; $('#nav').querySelectorAll('button[data-v]').forEach(b => b.classList.toggle('act', b.dataset.v === v)); }
function leave() { session++; playing = false; setPause(false); try { speechSynthesis.cancel(); } catch (e) {} }
function guard(next) {
  if (playing) { setPause(true); askConfirm('¿Salir de la partida? Se pierde el avance.', () => { leave(); next(); }, () => setPause(false), 'Salir', 'Seguir jugando'); return; }
  leave(); next();
}
const GO = { hub: () => showHub(), circuit: () => startCircuit(), progress: () => showProgress(), settings: () => showSettings(), help: () => showHelp() };
$('#nav').append(...NAVS.map(([v, l]) => h('button', { class: 'btn ghost', 'data-v': v, onclick: () => guard(GO[v]) }, l)),
  h('button', { class: 'btn ghost fsb', 'aria-label': 'Pantalla completa', onclick: () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} } }, '⛶'));
function show(node) { app.replaceChildren(node); window.scrollTo(0, 0); }
function setPause(v) { paused = v; $('#pause').hidden = !v; }
$('#resume').onclick = () => setPause(false);
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'Escape' || e.key.toLowerCase() === 'p') { if (playing) { setPause(!paused); e.preventDefault(); } return; }
  if (/^[1-9]$/.test(e.key) && playing && !paused) {
    const b = [...app.querySelectorAll('.opt:not(:disabled)')].filter(x => x.style.visibility !== 'hidden')[+e.key - 1];
    if (b) b.click();
  }
});

/* perfiles: selector y formularios */
function paintProfiles() {
  const sel = $('#prof'); sel.replaceChildren(...profiles.map(p => h('option', { value: p.id, selected: p.id === curId }, p.name + ' (' + p.age + ')')));
}
$('#prof').onchange = e => { const id = e.target.value; if (playing) paintProfiles(); guard(() => { curId = id; saveP(); paintProfiles(); rerender(); }); };
$('#addP').onclick = () => guard(() => profileForm(null));
$('#editP').onclick = () => guard(() => profileForm(cur()));
function profileForm(p) {
  const name = h('input', { type: 'text', value: p ? p.name : '', maxlength: 40, placeholder: 'Nombre' });
  const age = h('input', { type: 'number', min: 4, max: 17, value: p ? p.age : 8 });
  let close;
  const save = () => {
    const n = name.value.trim() || 'Alumno/a', a = Math.min(17, Math.max(4, +age.value || 8));
    if (p) { p.name = n; p.age = a; } else { const q = { id: 'p' + uid(), name: n, age: a }; profiles.push(q); curId = q.id; }
    saveP(); paintProfiles(); close(); rerender();
  };
  const del = () => askConfirm('¿Eliminar a ' + p.name + ' y todos sus resultados?', () => {
    results = results.filter(r => r.pid !== p.id); delete achs[p.id]; profiles = profiles.filter(x => x.id !== p.id);
    if (!profiles.length) profiles = [{ id: 'p' + uid(), name: 'Alumno/a 1', age: 8 }];
    curId = profiles[0].id; saveR(); saveA(); saveP(); paintProfiles(); close(); rerender();
  });
  close = modal(h('div', {}, h('h2', {}, p ? 'Editar alumno/a' : 'Nuevo alumno/a'),
    h('label', {}, 'Nombre'), name, h('label', {}, 'Edad (años)'), age,
    h('p', { class: 'muted' }, 'La edad solo se usa para sugerir el nivel de dificultad inicial.'),
    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: save }, 'Guardar'), h('button', { class: 'btn ghost', onclick: () => close() }, 'Cancelar'),
      p && profiles.length > 0 ? h('button', { class: 'btn danger', onclick: del }, 'Eliminar') : null)));
  name.focus();
}

/* ================= componentes de juego ================= */
function progress(root) {
  const bar = h('div', { class: 'prog' }, h('i')), lbl = h('span', { class: 'pl muted' }, '');
  root.append(h('div', { class: 'bar' }, bar, lbl));
  return (i, n) => { bar.firstChild.style.width = (100 * i / n) + '%'; lbl.textContent = i + ' / ' + n; };
}
const numOpts = a => {
  const s = new Set([a]);
  for (const d of shuffle([1, -1, 2, -2, 10, -10, 3, -3])) { if (a + d >= 0) s.add(a + d); if (s.size === 4) break; }
  return shuffle([...s]).map(v => ({ label: String(v), ok: v === a }));
};
/* Motor genérico de preguntas de elección: tiempo de respuesta, pistas, repaso de errores */
async function runQuiz(root, api, cfg) {
  const items = cfg.items, N = items.length, setP = progress(root);
  const stageEl = h('div'), choices = h('div', { class: 'row' + (cfg.choiceClass ? ' ' + cfg.choiceClass : '') }), fb = h('div', { class: 'fb', 'aria-live': 'polite' }), tools = h('div', { class: 'row' });
  let cur = null, correct = 0, hints = 0; const rts = [], fails = [], cats = {};
  const listenBtn = cfg.speak ? h('button', { class: 'btn ghost sm', onclick: () => speak(cfg.speak(cur.it)) }, '🔊 Escuchar') : null;
  const hintBtn = cfg.hint ? h('button', { class: 'btn ghost sm', onclick: () => {
    const c = [...choices.children].filter(b => !b.disabled && b.dataset.ok === '0');
    if (c.length > 1) { const b = pick(c); b.disabled = true; b.style.visibility = 'hidden'; hints++; cur.hinted = true; }
  } }, '💡 Pista') : null;
  [listenBtn, hintBtn].forEach(b => b && tools.append(b));
  root.append(h('div', { class: 'status' }, cfg.instr), stageEl, tools, choices, fb);
  for (let i = 0; i < N; i++) {
    if (!api.alive()) return;
    setP(i, N); fb.textContent = ''; fb.className = 'fb';
    cur = { it: items[i], hinted: false }; const it = cur.it;
    stageEl.replaceChildren(cfg.render(it));
    if (cfg.speak) say(cfg.speak(it));
    const opts = cfg.options(it), t0 = performance.now();
    const p = await new Promise(res => choices.replaceChildren(...opts.map(o => h('button', { class: 'opt' + (o.cls ? ' ' + o.cls : ''), 'data-ok': o.ok ? 1 : 0, onclick: e => res({ o, el: e.currentTarget }) }, o.label))));
    if (!api.alive()) return;
    rts.push(performance.now() - t0);
    [...choices.children].forEach(b => b.disabled = true);
    if (p.o.ok) { correct++; p.el.classList.add('right'); fb.textContent = '🦉 ' + (cfg.fbRight ? cfg.fbRight(it) : pick(PRAISE)); fb.className = 'fb good'; sOk(); }
    else {
      p.el.classList.add('wrong'); [...choices.children].find(b => b.dataset.ok === '1')?.classList.add('right');
      fails.push(cfg.failLabel(it)); if (cfg.cat) cats[cfg.cat(it)] = (cats[cfg.cat(it)] || 0) + 1;
      fb.textContent = '🦉 ' + (cfg.fbWrong ? cfg.fbWrong(it) : pick(RETRY)); fb.className = 'fb bad'; sBad();
    }
    cfg.onAnswer && cfg.onAnswer(it, p.o.ok, stageEl);
    await sleep(p.o.ok ? 1200 : 1800);
  }
  const rt = mean(rts) / 1000, notes = cfg.notes ? cfg.notes({ correct, N, rt, cats }) : [];
  const cs = Object.entries(cats).map(([k, v]) => k + ' (' + v + ')');
  if (cs.length) notes.push('Errores por categoría: ' + cs.join(', ') + '.');
  if (rt > 6) notes.push('Tiempo de respuesta medio alto (' + rt.toFixed(1) + ' s): puede indicar procesamiento lento o inseguridad; observar si hay estrategia.');
  api.end({
    score: correct, max: N, rt: Math.round(rt * 10) / 10, review: fails,
    lines: [['Aciertos', correct], ['Errores', N - correct], ['Tiempo medio (s)', rt.toFixed(1)], ...(cfg.hint ? [['Pistas usadas', hints]] : [])],
    notes
  });
}

/* ================= JUEGOS ================= */
/* 1. Secuencia de colores: memoria de trabajo */
async function runSimon(root, api, mode) {
  const cols = [{ n: 'Rojo', s: '▲', c: '#e5484d', f: 261 }, { n: 'Azul', s: '●', c: '#6e8bf0', f: 329 }, { n: 'Verde', s: '■', c: '#46c28a', f: 392 }, { n: 'Amarillo', s: '★', c: '#f5c518', f: 523 }];
  let len = [0, 2, 3, 4][api.level], lives = 3, best = 0, ok = 0, fail = 0, accepting = false, pending = null;
  const status = h('div', { class: 'status', 'aria-live': 'polite' }), livesEl = h('div', { class: 'lives' });
  const paintLives = () => livesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  const btns = cols.map((c, i) => h('button', { class: 'pad', style: '--c:' + c.c, disabled: true, onclick: () => tap(i) }, c.s + ' ' + c.n));
  root.append(livesEl, status, h('div', { class: 'pads' }, btns)); paintLives();
  const flash = async (i, d = 500) => { btns[i].classList.add('on'); beep(cols[i].f, d / 1000, 'triangle', .1); await sleep(d); btns[i].classList.remove('on'); };
  function tap(i) {
    if (!accepting || !pending) return;
    flash(i, 220); const p = pending; p.arr.push(i);
    if (p.arr[p.arr.length - 1] !== p.exp[p.arr.length - 1]) { accepting = false; pending = null; p.res(false); }
    else if (p.arr.length === p.exp.length) { accepting = false; pending = null; p.res(true); }
  }
  const waitTaps = exp => new Promise(res => { pending = { exp, arr: [], res }; accepting = true; });
  while (lives > 0 && len <= 9) {
    const seq = Array.from({ length: len }, () => rnd(4));
    status.textContent = 'Mirá con atención 👀'; btns.forEach(b => b.disabled = true);
    await sleep(800); if (!api.alive()) return;
    for (const i of seq) { await flash(i); if (!api.alive()) return; await sleep(250); }
    const exp = mode === 'inverso' ? [...seq].reverse() : seq;
    status.textContent = mode === 'inverso' ? 'Ahora repetí AL REVÉS 🔁' : '¡Tu turno! 👆';
    btns.forEach(b => b.disabled = false);
    const res = await waitTaps(exp); if (!api.alive()) return;
    btns.forEach(b => b.disabled = true);
    if (res) { best = Math.max(best, len); ok++; len++; status.textContent = '🦉 ' + pick(PRAISE); sOk(); }
    else { fail++; lives--; paintLives(); status.textContent = '🦉 Casi… probemos de nuevo'; sBad(); }
    await sleep(1100);
  }
  api.end({ score: best, max: 9, pct: Math.round(100 * best / 9), nosem: true, lines: [['Span máximo', best], ['Aciertos', ok], ['Errores', fail], ['Modo', mode]],
    notes: [mode === 'inverso' ? 'Modo inverso: exige retener Y manipular la información (memoria de trabajo).' : 'Modo directo: mide principalmente retención inmediata (span).'] });
}

/* 2. Estrella y bomba: Go/No-Go con práctica */
async function runGoNoGo(root, api) {
  const dur = [0, 1100, 900, 700][api.level], isi = [0, 600, 450, 350][api.level];
  const stim = h('div', { class: 'stim', 'aria-live': 'polite' });
  const status = h('div', { class: 'status' }, 'Tocá SOLO con la estrella ⭐. Con la bomba 💣 ¡no toques!');
  const btn = h('button', { class: 'btn go-btn', onpointerdown: e => { e.preventDefault(); respond(); } }, '¡TOCAR!');
  const setP = progress(root); root.append(status, stim, h('div', { class: 'row' }, btn));
  const key = e => { if (e.code === 'Space' && !e.repeat && playing && !paused) { e.preventDefault(); respond(); } };
  document.addEventListener('keydown', key);
  let cur = null, counting = false, hits = 0, omis = 0, comm = 0, rej = 0, antic = 0; const rts = [];
  function respond() {
    if (!cur) { if (counting) antic++; return; }
    if (cur.responded) return;

    else { errors++; consec = 0; fb.textContent = '✖ Incorrecto'; fb.className = 'fb bad'; sBad(); if (prevRule && pk === (prevRule === 'color' ? ci : si)) persev++; }

/* 8. Cálculo mental */
function calcItem(L) {
  const t = rnd(L === 1 ? 2 : L === 2 ? 4 : 5); let q, a;
  if (t === 0) { const x = R(1, L === 1 ? 5 : L === 2 ? 12 : 60), y = R(1, L === 1 ? 5 : L === 2 ? 9 : 40); q = x + ' + ' + y; a = x + y; }
  else if (t === 1) { const x = R(L === 1 ? 3 : 8, L === 1 ? 10 : L === 2 ? 20 : 99), y = R(1, Math.min(x - 1, L === 1 ? 9 : L === 2 ? 9 : 50)); q = x + ' − ' + y; a = x - y; }
  else if (t === 2) { const x = R(1, 9), z = x + R(2, L === 2 ? 11 : 40); q = x + ' + ❓ = ' + z; a = z - x; }
  else if (t === 3) { if (L === 2) { const n = R(1, 10); q = 'El doble de ' + n; a = 2 * n; } else { const x = pick([2, 3, 4, 5, 10]), y = R(2, 10); q = x + ' × ' + y; a = x * y; } }
  else { const y = pick([2, 3, 4, 5]), a0 = R(2, 10); q = (y * a0) + ' ÷ ' + y; a = a0; }
  return { q, a };
}
function runCalc(root, api) {
  const seen = new Set(), items = []; while (items.length < 10) { const it = calcItem(api.level); if (!seen.has(it.q)) { seen.add(it.q); items.push(it); } }
  return runQuiz(root, api, {

    render: it => h('div', { class: 'big', style: 'font-size:3rem' }, it.q + (it.q.includes('❓') ? '' : ' = ❓')),
    options: it => numOpts(it.a), fbWrong: it => 'El resultado era ' + it.a, failLabel: it => it.q + ' = ' + it.a,
    notes: () => ['Observar si usa estrategia (conteo con dedos, descomposición, cálculo directo). Diferenciar error de cálculo de error de comprensión de la operación.']

}

    const L = ['b', 'd', 'p', 'q'], m = Array.from({ length: 3 }, () => pick(L)).join(''), o = new Set([m]);
    while (o.size < 4) { const a = m.split(''); a[rnd(3)] = pick(L); o.add(a.join('')); }

  return runQuiz(root, api, {

  const total = cfg.n * cfg.m, k = Math.round(total * .3), limit = S.np ? Infinity : cfg.time;
  const cells = shuffle([...Array.from({ length: k }, () => pick(cfg.t)), ...Array.from({ length: total - k }, () => pick(cfg.d))]);
  const status = h('div', { class: 'status' }, 'Tocá todas las letras «' + cfg.t.join('» y «') + '»'), tm = h('div', { class: 'timer muted' }, '');
  const grid = h('div', { class: 'cgrid', style: 'grid-template-columns:repeat(' + cfg.m + ',1fr)' });
  let hits = 0, wrong = 0, done = false, elapsed = 0;
  const els = cells.map(c => h('button', { class: 'cell', onclick: e => {
    if (done) return; const b = e.currentTarget; b.disabled = true;
    if (cfg.t.includes(c)) { hits++; b.classList.add('right'); sOk(); if (hits === k) done = true; } else { wrong++; b.classList.add('wrong'); sBad(); }
    status.textContent = 'Encontradas: ' + hits + ' / ' + k;
  } }, c));
  els.forEach(e => grid.append(e)); root.append(status, tm, grid);
  while (!done && elapsed < limit) {
    if (!api.alive()) return;
    tm.textContent = limit === Infinity ? '' : '⏱ ' + Math.max(0, Math.ceil(limit - elapsed)) + ' s';
    await sleep(250); elapsed += .25;
  }
  done = true; els.forEach(e => e.disabled = true); if (!api.alive()) return;
  const omis = k - hits, pct = Math.round(100 * Math.max(0, hits - wrong) / k), notes = [];
  if (omis > k * .3) notes.push('Muchas omisiones (' + omis + '): posible dificultad en atención sostenida o búsqueda visual.');
  if (wrong > 3) notes.push('Varios toques equivocados (' + wrong + '): posible impulsividad o dificultad para discriminar letras similares.');
  if (!notes.length) notes.push('Búsqueda visual eficiente en esta tarea.');
  api.end({ score: Math.max(0, hits - wrong), max: k, pct, lines: [['Encontradas', hits + '/' + k], ['Omitidas', omis], ['Toques equivocados', wrong], ['Tiempo (s)', Math.round(elapsed)]], notes });
}

/* 14. Seguí las consignas */
async function runConsignas(root, api) {
  const steps = [[1, 1, 1, 1, 2, 2, 2, 2], [2, 2, 2, 2, 3, 3, 3, 3], [3, 3, 3, 3, 4, 4, 4, 4]][api.level - 1], N = steps.length, setP = progress(root);
  const instr = h('div', { class: 'status', style: 'font-size:1.25rem', 'aria-live': 'polite' }), board = h('div', { class: 'row' }), fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  root.append(instr, board, fb);
  let ok = 0, ordErr = 0, elemErr = 0, pending = null; const fails = [];
  const waitTaps = exp => new Promise(res => { pending = { exp, arr: [], res }; });
  const tap = id => {
    if (!pending) return; const p = pending; p.arr.push(id);
    if (id !== p.exp[p.arr.length - 1]) { pending = null; p.res(p.exp.includes(id) ? 'orden' : 'elemento'); }
    else if (p.arr.length === p.exp.length) { pending = null; p.res('ok'); }
  };
  for (let i = 0; i < N; i++) {
    if (!api.alive()) return; setP(i, N); fb.textContent = ''; fb.className = 'fb';
    const n = steps[i], all = shuffle([...Array(16).keys()]), exp = all.slice(0, n), brd = shuffle(all.slice(0, api.level === 3 ? 8 : 6));
    const txt = 'Tocá ' + exp.map((id, k) => (k === 0 ? '' : k === n - 1 ? (n > 2 ? ' y por último ' : ' y después ') : ', después ') + desc(id >> 2, id & 3)).join('') + '.';
    instr.textContent = txt; say(txt);
    board.replaceChildren(...brd.map(id => h('button', { class: 'ref', 'aria-label': desc(id >> 2, id & 3), onclick: () => tap(id) }, h('span', { class: 'shape', style: 'color:' + CO[id & 3] }, SH[id >> 2]))));
    if (api.level === 3) { sleep(5000 + n * 800).then(() => { if (pending && api.alive()) instr.textContent = '🙈 Consigna oculta: ¡recordala!'; }); }
    const r = await waitTaps(exp); if (!api.alive()) return;
    instr.textContent = txt;
    if (r === 'ok') { ok++; fb.textContent = '🦉 ' + pick(PRAISE); fb.className = 'fb good'; sOk(); }
    else { if (r === 'orden') ordErr++; else elemErr++; fails.push(txt); fb.textContent = '🦉 ' + (r === 'orden' ? 'Tocaste bien, pero en otro orden' : 'Ese elemento no estaba en la consigna'); fb.className = 'fb bad'; sBad(); }
    await sleep(1500);
  }
  api.end({ score: ok, max: N, review: fails, lines: [['Aciertos', ok], ['Errores de orden', ordErr], ['Elemento equivocado', elemErr]],
    notes: [ordErr > elemErr ? 'Predominan errores de orden: dificultad para sostener la secuencia (memoria de trabajo verbal / secuenciación).' : elemErr > 0 ? 'Predominan elementos equivocados: revisar comprensión de adjetivos (color/forma) o atención a la consigna.' : 'Buena comprensión y retención de consignas en esta tarea.',
      'Útil como proxy de seguimiento de instrucciones en el aula.'] });
}

const take = (a, n) => shuffle(a).slice(0, n);
const cyc = (a, n) => { let o = []; while (o.length < n) o = o.concat(shuffle(a)); return o.slice(0, n); };

/* Motor de armado: tocar piezas para ordenarlas (oraciones, sílabas, letras, historias) */
async function runBuilder(root, api, cfg) {
  const items = cfg.items, N = items.length, setP = progress(root);
  const promptEl = h('div'), slots = h('div', { class: 'slots' }), bank = h('div', { class: 'row' }), fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  const clear = h('button', { class: 'btn ghost sm' }, 'Borrar todo');
  root.append(h('div', { class: 'status' }, cfg.instr), promptEl, slots, bank, h('div', { class: 'row' }, clear), fb);
  const join = cfg.join == null ? ' ' : cfg.join; let correct = 0; const rts = [], fails = [];
  for (let i = 0; i < N; i++) {
    if (!api.alive()) return;
    setP(i, N); fb.textContent = ''; fb.className = 'fb'; clear.disabled = false;
    const it = items[i]; promptEl.replaceChildren(cfg.render ? cfg.render(it) : '');
    let parts, tries = 0; do { parts = shuffle(it.parts.map((p, k) => ({ p, k }))); tries++; } while (tries < 10 && parts.map(x => x.p).join(join) === it.parts.join(join));
    let placed = [], locked = false; const t0 = performance.now();
    const res = await new Promise(done => {
      const draw = () => {
        slots.replaceChildren(...placed.map(x => h('button', { class: 'tok' + (cfg.emo ? ' emo' : ''), disabled: locked, onclick: () => { placed = placed.filter(y => y !== x); draw(); } }, x.p)),
          ...Array.from({ length: parts.length - placed.length }, () => h('span', { class: 'slot' })));
        bank.replaceChildren(...parts.filter(x => !placed.includes(x)).map(x => h('button', { class: 'tok' + (cfg.emo ? ' emo' : ''), onclick: () => { placed.push(x); if (placed.length === parts.length) { locked = true; draw(); done(placed.map(y => y.p)); } else draw(); } }, x.p)));
      };
      clear.onclick = () => { if (!locked) { placed = []; draw(); } }; draw();
    });
    if (!api.alive()) return; clear.disabled = true; rts.push(performance.now() - t0);
    const ok = res.join(join) === it.parts.join(join);
    if (ok) { correct++; fb.textContent = '🦉 ' + pick(PRAISE); fb.className = 'fb good'; sOk(); }
    else { fails.push(it.parts.join(join)); fb.textContent = '🦉 ' + (cfg.fbWrong ? cfg.fbWrong(it) : 'Era: ' + it.parts.join(join)); fb.className = 'fb bad'; sBad(); }
    await sleep(ok ? 1100 : 2100);
  }
  const rt = mean(rts) / 1000;
  api.end({ score: correct, max: N, rt: Math.round(rt * 10) / 10, review: fails, lines: [['Aciertos', correct], ['Errores', N - correct], ['Tiempo medio (s)', rt.toFixed(1)]], notes: cfg.notes || [] });
}

/* ----- gráficos SVG ----- */
function radar(vals) {
  const n = vals.length, Rr = 112, cx = 200, cy = 165, pt = (i, r) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const poly = f => vals.map((v, i) => pt(i, Rr * f(v)).map(x => x.toFixed(1)).join(',')).join(' ');
  let s = '<svg viewBox="-30 0 460 330" role="img" aria-label="Perfil de rendimiento por área" style="width:100%;max-width:480px">';
  [.25, .5, .75, 1].forEach(f => s += '<polygon points="' + poly(() => f) + '" fill="none" stroke="var(--line)"/>');
  vals.forEach((v, i) => { const [x, y] = pt(i, Rr), [lx, ly] = pt(i, Rr + 12), dy = ly > cy + 4 ? 12 : ly < cy - 4 ? -2 : 4; s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)"/><text x="' + lx.toFixed(1) + '" y="' + (ly + dy).toFixed(1) + '" font-size="11" font-weight="700" fill="' + (v.v == null ? 'var(--muted)' : 'var(--ink)') + '" text-anchor="' + (Math.abs(lx - cx) < 10 ? 'middle' : lx > cx ? 'start' : 'end') + '">' + v.l + '</text>'; });
  s += '<polygon points="' + poly(v => (v.v || 0) / 100) + '" fill="color-mix(in srgb,var(--brand) 26%,transparent)" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>';
  vals.forEach((v, i) => { if (v.v != null) { const [x, y] = pt(i, Rr * v.v / 100); s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' + (AXC[v.l] || 'var(--brand)') + '" stroke="var(--panel)" stroke-width="2"/>'; } });
  return h('div', { html: s + '</svg>' });
}
function spark(vals) {
  if (!vals.length) return '';
  const w = 100, hh = 26, pts = vals.map((v, i) => (vals.length === 1 ? w / 2 : i * w / (vals.length - 1)).toFixed(1) + ',' + (hh - 2 - (hh - 4) * v / 100).toFixed(1)).join(' ');
  return h('span', { html: '<svg width="100" height="26" viewBox="0 0 100 26" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="var(--brand)" stroke-width="2"/></svg>' });
}

/* ----- progreso e informe ----- */
function csvOf(list) {

  return ['fecha,alumno,edad,juego,area,nivel,puntaje,maximo,porcentaje,detalle,observaciones', ...list.map(r => [new Date(r.ts).toISOString(), pn(r.pid).name, pn(r.pid).age, r.game, r.area, LV[r.level], r.score, r.max, r.pct, (r.lines || []).map(l => l.join(': ')).join(' | '), r.obs].map(q).join(','))].join('\n');
}

  const hist = rs.slice(-30).reverse().map(r => h('tr', {}, h('td', {}, new Date(r.ts).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })), h('td', {}, r.game), h('td', {}, LV[r.level]), h('td', {}, r.headline + ' · ' + r.pct + '%'), h('td', {}, r.obs || '')));
  show(h('div', {},

      h('div', { class: 'stats' }, [['Partidas', rs.length], ['Días jugados', days], ['Racha (días)', streak(p.id)], ['Logros', Object.keys(got).length + '/' + ACH.length]].map(([k, v]) => h('div', { class: 'stat' }, h('b', {}, String(v)), k))),
      h('div', { class: 'two' },
        h('div', { class: 'panel stage' }, h('h3', {}, 'Perfil por área'), radar(rv), h('small', { class: 'muted' }, 'Promedio de las últimas 3 partidas por área. Refleja el rendimiento en estos juegos, no es un baremo.')),
        h('div', { class: 'panel' }, h('h3', {}, 'Evolución por juego'), h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, ['Juego', 'Última', 'Mejor', 'Veces', 'Últimas 10'].map(x => h('th', {}, x)))), h('tbody', {}, rows))))),

      h('div', { class: 'panel' }, h('h3', {}, 'Historial (últimas 30)'), h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, ['Fecha', 'Juego', 'Nivel', 'Resultado', 'Notas'].map(x => h('th', {}, x)))), h('tbody', {}, hist)))))));

/* ----- ajustes ----- */
function importData(txt) {
  try {
    const d = JSON.parse(txt); if (!Array.isArray(d.profiles) || !Array.isArray(d.results)) throw 0;
    const pids = new Set(profiles.map(p => p.id)), rids = new Set(results.map(r => r.id));
    d.profiles.forEach(p => { if (p && p.id && !pids.has(p.id)) profiles.push(p); }); d.results.forEach(r => { if (r && r.id && !rids.has(r.id)) results.push(r); });
    Object.entries(d.ach || {}).forEach(([k, v]) => achs[k] = { ...v, ...(achs[k] || {}) });
    saveP(); saveR(); saveA(); paintProfiles(); toast('Copia importada (se combinó con lo existente)'); showSettings();
  } catch (err) { toast('El texto no es una copia válida.'); }
}

  const fileIn = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => importData(fr.result); fr.readAsText(f); } });

    h('div', { class: 'panel' }, h('h3', {}, 'Accesibilidad y apariencia'),
      h('label', {}, 'Tema ', h('select', { onchange: e => { S.theme = e.target.value; applySettings(); } }, [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']].map(([v, l]) => h('option', { value: v, selected: S.theme === v }, l)))),
      h('div', { class: 'row', style: 'justify-content:flex-start' }, 'Tamaño de letra:', h('button', { class: 'btn ghost sm', onclick: () => { S.fs = Math.max(.8, +(S.fs - .1).toFixed(1)); applySettings(); } }, 'A−'), h('button', { class: 'btn ghost sm', onclick: () => { S.fs = Math.min(1.6, +(S.fs + .1).toFixed(1)); applySettings(); } }, 'A+')),
      tg('Lectura fácil (letra espaciada, fondo crema; útil en dislexia)', 'easy'), tg('Alto contraste', 'contrast'), tg('Reducir movimiento y animaciones', 'reduce'),
      tg('Modo sin presión (oculta cronómetros, vidas y contadores)', 'np'), tg('Leer consignas y palabras en voz alta', 'voice'),
      h('label', {}, 'Volumen ', h('input', { type: 'range', min: 0, max: 1, step: .1, value: S.volume, oninput: e => { S.volume = +e.target.value; applySettings(); beep(660, .1); } }))),
    h('div', { class: 'panel' }, h('h3', {}, 'Datos'),

      h('div', { class: 'row', style: 'justify-content:flex-start' },
        h('button', { class: 'btn sm', onclick: () => download('copia-psicopedagogia.json', 'application/json', JSON.stringify({ v: 2, profiles, results, ach: achs })) }, '💾 Exportar copia (JSON)'),
        h('button', { class: 'btn ghost sm', onclick: () => fileIn.click() }, '📂 Importar copia'),
        h('button', { class: 'btn ghost sm', onclick: () => download('resultados-todos.csv', 'text/csv', csvOf(results)) }, '⬇ CSV de todos')), fileIn, imp, h('button', { class: 'btn ghost sm', onclick: () => importData(imp.value) }, 'Importar texto pegado'),
      h('h3', {}, 'Alumnos/as'), h('ul', {}, profiles.map(p => h('li', {}, p.name + ' (' + p.age + ') — ' + resOf(p.id).length + ' partidas '))),
      h('button', { class: 'btn danger sm', onclick: () => askConfirm('¿Borrar TODOS los datos (alumnos, resultados, ajustes)?', () => { ['pp2_profiles', 'pp2_cur', 'pp2_results', 'pp2_ach', 'pp2_settings', 'pp2_seen'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); location.reload(); }) }, '🗑 Borrar todo')))));
}
